# -- Number of replicas
replicaCount: 1

image:
  # -- Container image repository
  repository: hikma-health-server
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to Chart appVersion)
  tag: ""

# -- Image pull secrets for private registries (e.g. DigitalOcean Container Registry)
imagePullSecrets: []
#  - name: do-registry

nameOverride: ""
fullnameOverride: ""

# -- External PostgreSQL connection
# Provide either databaseUrl OR individual host/port/name/user/password fields.
externalDatabase:
  # -- Full connection string (takes precedence over individual fields)
  databaseUrl: ""
  # -- Use an existing Secret for DATABASE_URL instead of plaintext above.
  # The secret must contain a key named `DATABASE_URL`.
  existingSecret: ""
  # -- Individual connection fields (used when databaseUrl is empty)
  host: ""
  port: 5432
  name: "hhdb"
  user: "hikma"
  password: ""

serviceAccount:
  # -- Create a service account
  create: true
  # -- Annotations for the service account (e.g. for DigitalOcean workload identity)
  annotations: {}
  name: ""

service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 3000

ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name (use "nginx" for DigitalOcean managed ingress)
  className: "nginx"
  annotations: {}
  #  cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: hikma.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: hikma-tls
  #    hosts:
  #      - hikma.example.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Liveness probe
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 10

# -- Readiness probe
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# -- Additional environment variables
extraEnv: []
#  - name: SENTRY_DSN
#    value: "https://..."
