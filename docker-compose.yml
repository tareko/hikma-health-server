services:
  hikma-health:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hikma-health-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://hikma:hikma@postgres:5432/hhdb}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hikma-network

  # Internal PostgreSQL — start with: docker compose --profile db up
  postgres:
    image: postgres:16-alpine
    container_name: hikma-health-db
    restart: unless-stopped
    profiles:
      - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hikma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hikma}
      POSTGRES_DB: ${POSTGRES_DB:-hhdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hikma} -d ${POSTGRES_DB:-hhdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hikma-network

volumes:
  pgdata:
    driver: local

networks:
  hikma-network:
    name: hikma-network
    driver: bridge
